{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
{% endblock %}

{% block content %}
  {% if page and (page.url.startswith("results/") or page.url == "api/parameters/") %}
    <div hidden data-bz-layout="wide" data-bz-page="{{ page.url | replace('/', '-') | trim('-') }}"></div>
  {% endif %}
  {{ super() }}
{% endblock %}

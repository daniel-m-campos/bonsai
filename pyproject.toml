[build-system]
# numpy and typing_extensions are build-time deps for the stub step alone:
# nanobind's stubgen imports the built module (whose package imports numpy)
# and needs typing_extensions to render annotations below Python 3.11.
requires = [
    "scikit-build-core>=0.10",
    # nanobind 3 requires Python 3.10 and ships no requires_python metadata,
    # so an unpinned resolve installs it on 3.9 and fails at CMake time.
    "nanobind>=2.0,<3",
    "numpy>=1.26",
    "typing_extensions; python_version < '3.11'",
]
build-backend = "scikit_build_core.build"

[project]
name = "bonsai-gbt"
version = "2.0.0"
description = "Histogram gradient-boosted trees with a C++23 core"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Daniel M Campos" }]
dependencies = ["numpy>=1.26"]
keywords = ["gradient-boosting", "machine-learning", "gbdt", "decision-trees"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Everything bonsai.bench needs to reproduce the published benchmark tables:
#   pip install bonsai-gbt[bench] && python -m bonsai.bench.grinsztajn out.jsonl
# xgboost is bounded below 3.4 because its 3.4.0 wheel ships a CUDA 13 runtime
# that silently falls back to CPU on any pre-r580 driver; the bound moves only
# with a deliberate driver/image bump.
# nvidia-ml-py gives the VRAM sampler per-pid attribution via NVML, which works
# inside containers where nvidia-smi's PID namespace does not.
# scikit-learn is NOT listed: no bench module needs it. metrics.auc prefers
# roc_auc_score when it happens to be importable and otherwise computes the
# same tie-aware rank statistic itself.
bench = ["xgboost>=3.2,<3.4", "lightgbm", "catboost", "pandas", "openml", "nvidia-ml-py"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/daniel-m-campos/bonsai"
Documentation = "https://daniel-m-campos.github.io/bonsai/"
Changelog = "https://github.com/daniel-m-campos/bonsai/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = ["python/bonsai"]
cmake.version = ">=3.25"
# bonsai_stub writes the IDE stub and its py.typed marker beside the module;
# CMake's install rules put both in the wheel, so every wheel carries the
# signatures of the extension built in the same run.
build.targets = ["_bonsai", "bonsai_stub"]

[tool.scikit-build.cmake.define]
BONSAI_PYTHON = "ON"
BONSAI_TESTS = "OFF"
# BONSAI_OPENMP_STATIC is set by the wheel jobs (wheels.yml), not here: the
# wheels want a private static libomp to avoid the xgboost/lightgbm libomp
# deadlock, and can vendor a dynamic copy where no libomp.a exists (Linux,
# via auditwheel). An sdist / from-source `pip install` cannot vendor, so it
# must be free to fall back to a plain dynamic link instead of hard-failing
# on a system without a static libomp (issue #134).

# Ruff: python linting for python/ and scripts/ (make lint-python; version
# pinned in the Makefile the way LLVM is — formatter/linter drift breaks CI).
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "RUF"]
# ×/–/— in printed tables and docstrings are house style, not typos.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# The compute-DAG cost table reads as aligned rows; wrapping would break it.
"scripts/dag_model.py" = ["E501"]
# Template strings ARE the generated pages' one-line markdown paragraphs;
# wrapping them would hard-wrap the rendered prose.
"scripts/render_*.py" = ["E501"]

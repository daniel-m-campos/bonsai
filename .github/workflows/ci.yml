name: CI

# No workflow-level paths filter: the workflow always starts and the changes
# job below decides what runs. A skipped workflow never reports, so required
# checks stay pending forever under branch protection, and a second copy of
# the path rules drifts from the first (docs/guide/** was re-included here
# but missing from the snippets filter, so guide-only pull requests started
# the workflow and ran nothing).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # CMake honors this env var at first configure; the Makefile stays clean.
  CMAKE_CXX_COMPILER_LAUNCHER: ccache

jobs:
  # The single path rule. `snippets` is prose that carries executable .run
  # blocks (docs/use/**, docs/guide/**, README.md), which only the python job
  # needs; `code` is everything else outside docs. Prose with neither leaves
  # both false, and every job below skips.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
      snippets: ${{ steps.filter.outputs.snippets }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            snippets:
              - "docs/use/**"
              - "docs/guide/**"
              - "README.md"
            code:
              - "**"
              - "!docs/**"
              - "!README.md"
              - "!CHANGELOG.md"
              - "!mkdocs.yml"

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: astral-sh/setup-uv@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-test
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-build-${{ hashFiles('CMakeLists.txt') }}
      # Only what the fetch scripts write: tests/data also holds committed
      # fixtures (tiny.csv, the v7 models), and caching the directory
      # restores a stale copy of those over the checkout.
      # The key is versioned because entries saved under the old one archived
      # the whole directory; only a new key stops those restoring.
      - uses: actions/cache@v4
        with:
          path: |
            tests/data/.toy-fetched
            tests/data/california_housing_*.csv
          key: toy-data-v2-${{ hashFiles('scripts/fetch_toy.py') }}
      - run: make build
      - run: make test

  sanitize:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: astral-sh/setup-uv@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: sanitize
      - uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ hashFiles('CMakeLists.txt') }}
      # Fetched files only; see the build-test job's note.
      - uses: actions/cache@v4
        with:
          path: |
            tests/data/.toy-fetched
            tests/data/california_housing_*.csv
          key: toy-data-v2-${{ hashFiles('scripts/fetch_toy.py') }}
      # detect_leaks=0: libomp keeps its thread pool alive past exit and
      # LSan flags the runtime's own allocations, not bonsai's.
      - run: make test-asan
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1

  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - run: make format-check

  tidy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-build-${{ hashFiles('CMakeLists.txt') }}
      - run: make configure
      - run: make lint

  python:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.snippets == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # 3.9 is the pyproject floor, 3.12 is uv's modern default; a tomllib
      # import once broke on 3.10 because only the floor-or-newer end of
      # this range was ever exercised.
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: astral-sh/setup-uv@v5
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: python  # shared: only the bindings TU differs by Python version
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-build-${{ hashFiles('CMakeLists.txt') }}
      # Fetched files only; see the build-test job's note.
      - uses: actions/cache@v4
        with:
          path: |
            tests/data/.toy-fetched
            tests/data/.amazon-fetched
            tests/data/california_housing_*.csv
            tests/data/amazon_*.csv
          key: toy-data-v2-${{ hashFiles('scripts/fetch_toy.py', 'scripts/fetch_amazon.py') }}
      # lightgbm: test_estimators.py cross-checks feature importances against it.
      # typing_extensions: the extension build generates the IDE stub, and
      # nanobind's stubgen requires it below Python 3.11.
      - run: uv venv --python ${{ matrix.python }} .venv && uv pip install --python .venv/bin/python nanobind numpy lightgbm scikit-learn pytest typing_extensions
      # ruff first: a lint finding shouldn't cost a build to discover.
      - run: make lint-python
      # The five doc gates (stdlib only): generated pages in sync (results
      # ledger, parameters reference, make map, timeline) and the mechanical
      # STYLE.md prose checks. Same command locally: make docs-check.
      - run: make docs-check
      # integration/test_cli_parity.py needs the built binary.
      - run: make build
      - run: make python-test
      # Every ```{.python .run} example in the published docs, executed against
      # the module built by python-test (build/python). Uses the venv python
      # so numpy and the ABI-matched extension resolve; GPU blocks are listed
      # and skipped without --gpu.
      - run: PYTHONPATH=build/python .venv/bin/python scripts/run_docs_examples.py

  # Compile-only: no GPU runners, but the kernel TU should not silently rot.
  cuda-compile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-llvm
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: cuda-compile
      - uses: actions/cache@v4
        with:
          path: build-cuda/_deps
          key: deps-cuda-${{ hashFiles('CMakeLists.txt') }}
      - uses: ./.github/actions/setup-cuda
        id: cuda
      - name: Configure and build (sm_80, tests off)
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-21/bin/clang++ \
            -DBONSAI_CUDA=ON -DBONSAI_CUDA_ARCH=sm_80 -DBONSAI_TESTS=OFF \
            -DCUDAToolkit_ROOT=${{ steps.cuda.outputs.root }} \
            -G Ninja -S . -B build-cuda
          cmake --build build-cuda -j

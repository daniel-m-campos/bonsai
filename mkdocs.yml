site_name: bonsai
site_description: Histogram gradient-boosted trees with a C++23 core, written to be read.
site_url: https://daniel-m-campos.github.io/bonsai/
repo_url: https://github.com/daniel-m-campos/bonsai
repo_name: daniel-m-campos/bonsai
docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/bonsai-logo.png
  favicon: assets/bonsai-logo.png
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: bonsai-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: bonsai-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.view

# Internal material stays out of the public site: ops/ (the pod runbook),
# hooks/, the writing contract and the invariants source.
# CONVENTION: new internal material goes INSIDE one of the excluded
# directories above; a new top-level docs/*.md is published by default, so
# only create one when it belongs on the site.
exclude_docs: |
  STYLE.md
  FEEDBACK.md
  ops/
  hooks/
  invariants.src.md

edit_uri: edit/main/docs/
copyright: 'bonsai · <a href="https://github.com/daniel-m-campos/bonsai">GitHub</a>'

hooks:
  - docs/hooks/repo_links.py
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [build/python]
          options:
            allow_inspection: false
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_overloads: true
            members_order: source
            filters: ["!^_"]
            extensions:
              - docs/hooks/griffe_bonsai.py:OverloadOnlyFunctions
              - docs/hooks/griffe_bonsai.py:LiveDocstrings

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: "#"
      permalink_title: Link to this section
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
              tag: div

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css
  - stylesheets/bonsai.css

nav:
  - Home: index.md
  - Learn:
      - The algorithm:
          - guide/README.md
          - 0. A tree by hand: guide/0-a-tree-by-hand.md
          - 1. Gradient boosting: guide/1-gradient-boosting.md
          - 2. Binning and histograms: guide/2-binning-and-histograms.md
          - 3. Finding splits: guide/3-finding-splits.md
          - 4. Growing trees: guide/4-growing-trees.md
          - 5. Sampling: guide/5-sampling.md
          - 6. Regularization and constraints: guide/6-regularization-and-constraints.md
          - 7. Early stopping and DART: guide/7-early-stopping-and-dart.md
          - 8. Feature importance: guide/8-feature-importance.md
          - 9. Parallelism and determinism: guide/9-parallelism-and-determinism.md
          - 10. GPU training: guide/10-gpu-training.md
          - 11. Performance engineering: guide/11-performance-engineering.md
          - 12. Multiclass: guide/12-multiclass.md
          - 13. Categorical features: guide/13-categorical-features.md
          - 14. Feature selection: guide/14-feature-selection.md
          - 15. Explaining predictions: guide/15-explaining-predictions.md
          - 16. Multi-target regression: guide/16-multi-target.md
      - The engine:
          - learn/engine/README.md
          - E1. The marginal round: learn/engine/1-the-marginal-round.md
          - E2. The missing bin: learn/engine/2-the-missing-bin.md
          - E3. The parity verdict: learn/engine/3-the-parity-verdict.md
          - E4. The resident objective: learn/engine/4-the-resident-objective.md
          - E5. The ceiling: learn/engine/5-the-ceiling.md
          - E6. The wide-data wall: learn/engine/6-the-wide-data-wall.md
          - E7. The lane finder: learn/engine/7-the-lane-finder.md
      - The CPU track:
          - learn/cpu/README.md
          - C1. Cache awareness: learn/cpu/1-cache-awareness.md
          - C2. Dividing the work: learn/cpu/2-dividing-the-work.md
          - C3. Coordination costs: learn/cpu/3-coordination-costs.md
      - Determinism as a contract: learn/determinism-as-a-contract.md
      - How we got here: learn/timeline.md
  - API:
      - Install: api/install.md
      - Quickstart: api/quickstart.md
      - Parameters: api/parameters.md
      - Reference: api/reference.md
      - Building from source: api/building.md
  - Results:
      - results/README.md
      - The results ledger: results/results.md
      - The scenario panels: results/results/perf.md
      - Grinsztajn standings: results/results/quality-grinsztajn.md
      - The code division: results/results/code-metrics.md
      - The archive: results/results/archive.md
      - The benchmark protocol: results/benchmark-protocol.md
      - Reproducing the results: results/benchmarks.md
